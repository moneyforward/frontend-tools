name: test

on:
  pull_request:
    branches:
      - "*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Initialize
        uses: ./.github/actions/restore-node

      - name: Run Lint
        run: pnpm -r lint

      - name: Run Test
        run: pnpm -r test
