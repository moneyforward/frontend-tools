name: Update snapshots

# A dependency update can change the rules a config resolves to, for example when a plugin adds a
# rule to its recommended set. The snapshot tests then fail until the snapshots record the new
# configuration. This workflow regenerates them on Renovate pull requests and pushes the result back
# to the pull request branch as an additional commit.
#
# Renovate keeps managing the branch (rebasing, automerging) because `gitIgnoredAuthors` in
# `renovate.json` lists the app that authors the commit. A rebase drops the commit, and the next run
# of this workflow adds it again.
#
# This is not a required status check, so a `paths` filter is safe. Every dependency update touches
# the lockfile.
on:
  pull_request:
    paths:
      - pnpm-lock.yaml

permissions: {}

concurrency:
  group: update-snapshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Runs the updated dependencies, so this job gets a read-only token and no secrets.
  # The commit is made by the `commit` job, which never executes code from the pull request.
  generate:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      patch: ${{ steps.diff.outputs.patch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: ./.github/actions/restore-node

      # `--update` rewrites mismatching snapshots instead of failing on them. Any other test failure
      # still fails the job, and nothing is committed.
      - name: Update snapshots
        run: pnpm -r --no-bail test --update

      # Job outputs are limited to 1 MB in total. A compressed diff stays far below that even when
      # every snapshot changes, whereas the full snapshot files would not.
      - name: Collect snapshot changes
        id: diff
        run: |
          pathspec=':(glob)packages/**/__snapshots__/*.snap'
          if git diff --quiet -- "$pathspec"; then
            echo '::notice::Snapshots are up to date.'
            exit 0
          fi
          git diff --stat -- "$pathspec"
          patch=$(git diff --no-color --no-ext-diff -- "$pathspec" | gzip -9 | base64 -w0)
          if [ "${#patch}" -gt 900000 ]; then
            echo '::error::The snapshot diff is too large to hand over as a job output. Update the snapshots by hand.'
            exit 1
          fi
          echo "patch=$patch" >> "$GITHUB_OUTPUT"

  commit:
    needs: generate
    if: needs.generate.outputs.patch != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # The patch comes from a job that ran third-party code. Accept nothing but in-place edits of
      # snapshot files already tracked as regular files.
      - name: Apply snapshot changes
        env:
          PATCH: ${{ needs.generate.outputs.patch }}
        run: |
          patch_file="$RUNNER_TEMP/snapshots.patch"
          base64 -d <<< "$PATCH" | gunzip > "$patch_file"

          if [ -n "$(git apply --summary "$patch_file")" ]; then
            echo '::error::The patch creates, deletes, renames or changes the mode of a file.'
            exit 1
          fi

          git apply --numstat "$patch_file" | cut -f3 > "$RUNNER_TEMP/snapshot-files"
          while IFS= read -r file; do
            if ! grep -Eq '^packages/[^/]+/([^/]+/)*__snapshots__/[^/]+\.snap$' <<< "$file" \
              || [[ "$file" == *..* ]] \
              || [[ "$(git ls-files --stage -- "$file" | cut -d' ' -f1)" != 100644 ]]; then
              echo "::error::Unexpected file in the patch: $file"
              exit 1
            fi
          done < "$RUNNER_TEMP/snapshot-files"

          git apply "$patch_file"
          git diff --stat

      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-contents: write

      # Commit through the API so the change is signed and attributed to the app, and passes the
      # `require_extra_approval_for_unattributed_changes` rule. `expectedHeadOid` rejects the commit
      # when the branch moved after this run started; the run for the newer head takes over.
      - name: Commit to the pull request branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          while IFS= read -r file; do
            base64 -w0 "$file" | jq -Rs --arg path "$file" '{path: $path, contents: .}'
          done < "$RUNNER_TEMP/snapshot-files" | jq -s . > "$RUNNER_TEMP/additions.json"

          jq -n \
            --slurpfile additions "$RUNNER_TEMP/additions.json" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$HEAD_REF" \
            --arg head "$HEAD_SHA" \
            --arg body "Generated by $RUN_URL" \
            '{
              query: "mutation ($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              variables: {
                input: {
                  branch: { repositoryNameWithOwner: $repository, branchName: $branch },
                  expectedHeadOid: $head,
                  message: { headline: "test: update snapshots", body: $body },
                  fileChanges: { additions: $additions[0] }
                }
              }
            }' > "$RUNNER_TEMP/payload.json"

          gh api graphql --input "$RUNNER_TEMP/payload.json" --jq '.data.createCommitOnBranch.commit.url'
