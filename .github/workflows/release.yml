name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: dry-run
        required: true
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # to enable use of OIDC for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      # `@semantic-release/changelog` prepends to the `CHANGELOG.md` that lives on `main`.
      # Leaving a previous release pull request unmerged would silently drop its entries from the next one.
      - name: Ensure no open release pull request
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          open=$(gh pr list -R "${{ github.repository }}" --state open --base main \
            --json headRefName --jq '[.[] | select(.headRefName | endswith("-release-packages"))] | length')
          if [ "$open" -ne 0 ]; then
            echo "::error::An open release pull request already exists. Merge it before releasing again."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize
        uses: ./.github/actions/restore-node

      - name: Release
        run: pnpm -r --workspace-concurrency=1 release ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Resolve branch name
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: branch
        run: echo "name=chore/$(date -u +%Y%m%d)-release-packages" >> "$GITHUB_OUTPUT"

      # The default branch rejects direct pushes, so the version bumps and changelogs
      # generated above are handed back to `main` through a pull request.
      - name: Create release pull request
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          branch: ${{ steps.branch.outputs.name }}
          delete-branch: true
          # Commit through the API so the changes are attributed to the app and pass
          # the `require_extra_approval_for_unattributed_changes` rule.
          sign-commits: true
          add-paths: |
            packages/*/CHANGELOG.md
            packages/*/package.json
          # `check_pull_request_title` requires the single commit message to match the title.
          commit-message: 'chore(release): update changelogs and package versions'
          title: 'chore(release): update changelogs and package versions'
          body: |
            Applies the `CHANGELOG.md` and `package.json` updates generated by the release run.

            The packages are already published to npm and tagged; this pull request only
            syncs the repository with what was released.

            Release run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
