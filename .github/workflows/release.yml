name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: dry-run
        required: true
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # to enable use of OIDC for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      # `@semantic-release/changelog` prepends to the `CHANGELOG.md` that lives on `main`.
      # Leaving a previous release pull request unmerged would silently drop its entries from the next one.
      - name: Ensure no open release pull request
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          open=$(gh pr list -R "${{ github.repository }}" --state open --base main \
            --json headRefName --jq '[.[] | select(.headRefName | endswith("-release-packages"))] | length')
          if [ "$open" -ne 0 ]; then
            echo "::error::An open release pull request already exists. Merge it before releasing again."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize
        uses: ./.github/actions/restore-node

      # `--no-bail` keeps the packages independent: one failing release must not stop the others.
      - name: Release
        run: pnpm -r --workspace-concurrency=1 --no-bail release ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Resolve branch name
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        id: branch
        run: echo "name=chore/$(date -u +%Y%m%d)-release-packages" >> "$GITHUB_OUTPUT"

      # The default branch rejects direct pushes, so the version bumps and changelogs
      # generated above are handed back to `main` through a pull request.
      #
      # This runs even when the release step failed: a package that did publish has already
      # been tagged, so dropping its version bump would leave the repository out of sync.
      - name: Create release pull request
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        id: release-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          branch: ${{ steps.branch.outputs.name }}
          delete-branch: true
          # Commit through the API so the changes are attributed to the app and pass
          # the `require_extra_approval_for_unattributed_changes` rule.
          sign-commits: true
          add-paths: |
            packages/*/CHANGELOG.md
            packages/*/package.json
          # `check_pull_request_title` requires the single commit message to match the title.
          commit-message: "chore(release): update changelogs and package versions"
          title: "chore(release): update changelogs and package versions"
          body: |
            Applies the `CHANGELOG.md` and `package.json` updates generated by the release run.

            The packages are already published to npm and tagged; this pull request only
            syncs the repository with what was released.

            Release run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # `add-paths` already narrows the commit, but check the pull request itself as well:
      # the approval below must never cover anything but changelogs and version bumps.
      - name: Verify the release pull request only touches changelogs and versions
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' && steps.release-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.release-pr.outputs.pull-request-number }}
        run: |
          unexpected=$(gh pr diff "$PR" -R "${{ github.repository }}" --name-only \
            | grep -Ev '^packages/[^/]+/(CHANGELOG\.md|package\.json)$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected files in the release pull request: $unexpected"
            exit 1
          fi

      # `GITHUB_TOKEN` is deliberate: the pull request is authored by the app, and GitHub
      # rejects a review coming from the same identity. `github-actions[bot]` counts as a
      # separate reviewer, and the repository allows Actions to approve pull requests.
      - name: Approve the release pull request
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' && steps.release-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.release-pr.outputs.pull-request-number }}
        run: |
          gh pr review "$PR" -R "${{ github.repository }}" --approve \
            --body "The diff is generated by the release run and limited to changelogs and version bumps."

      # Enabled with the app token so that the resulting push to `main` stays attributed to the app.
      - name: Enable auto-merge
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' && steps.release-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.release-pr.outputs.pull-request-number }}
        run: gh pr merge "$PR" -R "${{ github.repository }}" --squash --auto
